name: Local Provider and MCP Regression

on:
  pull_request:
    paths:
      - ".github/workflows/local-provider-mcp-regression.yml"
      - "platform/scripts/mcp-smoke*.mjs"
      - "platform/scripts/source-audit*.mjs"
      - "platform/backend/src/routes/chat/model-fetchers/ollama*.ts"
      - "platform/backend/src/routes/proxy/routes/ollama*.ts"
      - "deploy/local/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "local-provider-mcp-regression-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  mcp-protocol:
    name: MCP protocol and security smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Run no-dependency MCP protocol and denial tests
        run: node --test platform/scripts/mcp-smoke.test.mjs

  ollama:
    name: Ollama provider and proxy regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
        with:
          working-directory: platform
      - name: Lint only changed backend sources
        run: >
          pnpm exec biome check
          backend/src/routes/chat/model-fetchers/ollama.ts
          backend/src/routes/chat/model-fetchers/ollama.test.ts
          backend/src/routes/proxy/routes/ollama.ts
          backend/src/routes/proxy/routes/ollama.test.ts
          backend/src/routes/proxy/routes/ollama-native.ts
          backend/src/routes/proxy/routes/ollama-passthrough-policy.ts
          backend/src/routes/proxy/routes/ollama-passthrough-policy.unit.test.ts
      - name: Run DB-free policy regression
        run: >
          pnpm --dir backend exec vitest run --project unit
          src/routes/proxy/routes/ollama-passthrough-policy.unit.test.ts
      - name: Run model discovery tests
        run: >
          pnpm --dir backend exec vitest run --project clean
          src/routes/chat/model-fetchers/ollama.test.ts
      - name: Restore backend native dependencies
        id: native-cache
        uses: ./.github/actions/cache-backend-napi
      - name: Prepare pinned Rust toolchain if cache missed
        if: steps.native-cache.outputs.usable != 'true'
        uses: ./.github/actions/setup-rust-build
        with:
          workspaces: platform/archestra-rs
          shared-key: local-provider-regression
      - name: Build native backend dependencies if cache missed
        if: steps.native-cache.outputs.usable != 'true'
        run: pnpm exec turbo build --filter="@backend^..."
      - name: Verify loaded native dependencies
        run: node ../.github/scripts/verify-backend-napi.cjs
      - name: Run Ollama catch-all integration tests
        run: >
          pnpm --dir backend exec vitest run --project clean
          src/routes/proxy/routes/ollama.test.ts

  audit-source:
    name: Tracked-source security triage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Validate source inventory and redaction behavior
        run: node --test platform/scripts/source-audit.test.mjs
      - name: Inventory all tracked files and flag review candidates
        run: node platform/scripts/source-audit.mjs
      - name: Upload redacted code-review candidate inventory
        uses: ./.github/actions/github-upload-artifact
        with:
          name: archestra-source-audit
          path: .artifacts/source-audit.json
          retention-days: "14"
          if-no-files-found: error

  compose:
    name: Local Docker Compose validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate local deployment manifest
        shell: bash
        env:
          ARCHESTRA_AUTH_ADMIN_PASSWORD: ci-local-only-not-a-real-secret
        run: |
          bash -n deploy/local/up.sh
          cp deploy/local/.env.example deploy/local/.env
          docker compose --env-file deploy/local/.env -f deploy/local/compose.yaml config --quiet
          docker compose --env-file deploy/local/.env -f deploy/local/compose.yaml config --images
